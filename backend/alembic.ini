# Alembic configuration for Mai.
# The database URL is NOT stored here -- it is read from DATABASE_URL by
# alembic/env.py so secrets stay in the environment.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Migration filenames: 0001_description.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

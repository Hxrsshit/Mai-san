# Mai -- Stage 1 development environment.
#
#   cp .env.example .env    # then set the key for your LLM_PROVIDER
#   docker compose up --build
#
# Frontend  http://localhost:3000
# Backend   http://localhost:8000  (docs at /docs)

services:
  db:
    image: postgres:16-alpine
    container_name: mai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mai}
      # No default. A database holding personal conversations and memories
      # must not ship with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mai}
    ports:
      # Loopback only. Docker binds 0.0.0.0 by default, which would put a
      # database of personal memories on every interface of the host --
      # reachable from the local network. Use `docker compose exec db psql`
      # for access from elsewhere.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down`.
      - mai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mai} -d ${POSTGRES_DB:-mai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mai-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the compose service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-mai}
      # One provider, chosen explicitly. See docs/stage4ff_provider_gateway.md.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      # Neither key is required at compose time, because only one provider
      # runs and requiring both would make selecting Anthropic depend on
      # holding a Groq key. The configured provider reports its own missing
      # credential, which names the right one.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Gemini, through the same policed client as Groq. Base URL is not
      # passed: it stays the settings default, so the container cannot be
      # pointed at another host by an environment variable.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # Anthropic *API* billing, distinct from a Claude subscription --
      # which Mai does not and may not use.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Stage 4F-G. A "Desktop app" OAuth client. Optional: without it the
      # calendar integration reports not_configured and reads nothing.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/api/integrations/google/callback}
      # Gmail has its own callback so each one validates a single scope set.
      # Register both in the Google Cloud console.
      GOOGLE_GMAIL_REDIRECT_URI: ${GOOGLE_GMAIL_REDIRECT_URI:-http://127.0.0.1:8000/api/integrations/gmail/callback}
      # OAuth tokens live here. A named volume, not a bind mount: the tokens
      # belong to the container's own state rather than the source tree, so
      # they cannot be committed and are not copied into an image.
      MAI_CREDENTIAL_DIR: /var/lib/mai/credentials
      # Stage 5C. Exports are read from a directory, not uploaded: an upload
      # endpoint would mean multipart form parsing, adding `python-multipart`
      # and putting Starlette's form parser on a reachable path -- which is
      # what currently makes its form-parsing advisory inapplicable here.
      # Mounted read-only, because the application only ever reads an export.
      HISTORY_IMPORT_ENABLED: ${HISTORY_IMPORT_ENABLED:-true}
      MAI_IMPORT_DIR: /var/lib/mai/imports
      # The zone calendar windows are built in. A container runs in UTC and
      # the user does not; "tomorrow" is a local idea, so this decides which
      # day a calendar question actually reads.
      MAI_TIMEZONE: ${MAI_TIMEZONE:-UTC}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Optional. Absent, web search reports NOT_CONFIGURED and the
      # capability reports itself unavailable -- which is correct rather
      # than broken. No `:?` guard, unlike the keys the app cannot start
      # without: a deployment with no search provider is a supported one.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-40}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      # Loopback only. The API has no authentication: every endpoint,
      # including the DELETE routes, is open to whoever can reach the port.
      # Until an auth stage exists, that must not be the local network.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Source is mounted so host edits apply on container restart
      # (the CMD does not run uvicorn --reload).
      - ./backend:/app
      # OAuth tokens. A named volume so they survive a restart, stay out of
      # the source tree, and never enter an image layer.
      - mai_credentials:/var/lib/mai/credentials
      # Where you drop a ChatGPT export. Read-only: the importer reads, and
      # nothing in the application writes back to your export folder.
      - ${MAI_IMPORT_DIR:-./imports}:/var/lib/mai/imports:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        # Reached from the browser, so it is localhost -- not the service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: mai-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mai_pgdata:
  mai_credentials:

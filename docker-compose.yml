# Mai -- Stage 1 development environment.
#
#   cp .env.example .env    # then set GROQ_API_KEY
#   docker compose up --build
#
# Frontend  http://localhost:3000
# Backend   http://localhost:8000  (docs at /docs)

services:
  db:
    image: postgres:16-alpine
    container_name: mai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mai}
      # No default. A database holding personal conversations and memories
      # must not ship with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mai}
    ports:
      # Loopback only. Docker binds 0.0.0.0 by default, which would put a
      # database of personal memories on every interface of the host --
      # reachable from the local network. Use `docker compose exec db psql`
      # for access from elsewhere.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down`.
      - mai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mai} -d ${POSTGRES_DB:-mai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mai-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the compose service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-mai}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in .env}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Optional. Absent, web search reports NOT_CONFIGURED and the
      # capability reports itself unavailable -- which is correct rather
      # than broken. No `:?` guard, unlike the keys the app cannot start
      # without: a deployment with no search provider is a supported one.
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-40}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      # Loopback only. The API has no authentication: every endpoint,
      # including the DELETE routes, is open to whoever can reach the port.
      # Until an auth stage exists, that must not be the local network.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Source is mounted so host edits apply on container restart
      # (the CMD does not run uvicorn --reload).
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        # Reached from the browser, so it is localhost -- not the service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: mai-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  mai_pgdata:
